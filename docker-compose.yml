# Frolo self-hosted web panel (beta). LAN-only by default on port 4512.
# Data (SQLite, vault, keys) persists in a named volume. Frolo NEVER opens a
# router mapping to expose itself — put it behind your own HTTPS reverse proxy
# for remote access (see docs/REVERSE_PROXY.md).

services:
  frolo:
    image: ${FROLO_IMAGE:-ghcr.io/meowydev/frolo:0.1.0-beta.1}
    container_name: frolo
    restart: unless-stopped
    # Bind to the host on :4512. Change the left side to 127.0.0.1:4512 to keep
    # it strictly local to this machine.
    ports:
      - "${FROLO_BIND:-0.0.0.0}:4512:4512"
    environment:
      FROLO_PORT: "4512"
      FROLO_HOST: "0.0.0.0"
      FROLO_DATA_DIR: "/opt/frolo/data"
      FROLO_WEB_ROOT: "/app/web"
      # Set to 1 only when Frolo runs behind an HTTPS reverse proxy.
      FROLO_BEHIND_TLS: "${FROLO_BEHIND_TLS:-0}"
      FROLO_ALLOWED_ORIGINS: "${FROLO_ALLOWED_ORIGINS:-}"

      # --- Real mode (OFF by default) ---------------------------------------
      # Real Proxmox/SSH/router automation stays disabled unless BOTH of these
      # are 1 AND an operator has configured + selected a Proxmox connection in
      # the panel (Settings). With them unset, Frolo runs entirely in mock mode
      # and never contacts real infrastructure. See docs/DEPLOYMENT.md.
      FROLO_ENABLE_REAL_MODE: "${FROLO_ENABLE_REAL_MODE:-0}"
      FROLO_REAL_SAFETY_TESTS_PASSED: "${FROLO_REAL_SAFETY_TESTS_PASSED:-0}"
      # Chromium location baked into the image (router Teach Mode / replay).
      PLAYWRIGHT_BROWSERS_PATH: "/opt/frolo/pw-browsers"

      # --- Production licensing (public key only) ---------------------------
      # Provide production Ed25519 PUBLIC verification keys as inline JSON, or
      # mount a file and set FROLO_LICENSE_KEYS_FILE (see the volumes note
      # below). NEVER put a private signing key here. With neither set, Frolo
      # runs on the free Home tier.
      FROLO_LICENSE_KEYS: "${FROLO_LICENSE_KEYS:-}"
      FROLO_LICENSE_KEYS_FILE: "${FROLO_LICENSE_KEYS_FILE:-}"
    volumes:
      - frolo-data:/opt/frolo/data
      # Optional: mount a directory holding your production public license keys
      # (read-only) and point FROLO_LICENSE_KEYS_FILE at a file inside it, e.g.
      #   FROLO_LICENSE_KEYS_FILE=/opt/frolo/license/keys.json
      # Uncomment and adjust the host path to use it:
      # - ${FROLO_LICENSE_DIR:-./license}:/opt/frolo/license:ro
    # Give the server time to flush on stop (graceful shutdown).
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4512/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  frolo-data:
    name: frolo-data
