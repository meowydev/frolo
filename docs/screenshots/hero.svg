<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" role="img" aria-label="Frolo — self-hosted Proxmox deployment panel (placeholder)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12151c"/>
      <stop offset="1" stop-color="#0b0d11"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b6cff"/>
      <stop offset="1" stop-color="#8ab4f8"/>
    </linearGradient>
  </defs>
  <rect width="820" height="420" rx="14" fill="url(#bg)"/>
  <!-- app bar -->
  <rect x="0" y="0" width="820" height="56" rx="14" fill="#171a21"/>
  <rect x="0" y="42" width="820" height="14" fill="#171a21"/>
  <circle cx="30" cy="28" r="8" fill="url(#accent)"/>
  <text x="50" y="34" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#e7e9ee">Frolo panel</text>
  <rect x="132" y="18" width="46" height="20" rx="10" fill="#8ab4f8"/>
  <text x="140" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0b0d11">beta</text>
  <!-- nav -->
  <rect x="16" y="72" width="180" height="332" rx="10" fill="#171a21"/>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#9aa4b2">
    <rect x="28" y="88" width="156" height="30" rx="7" fill="#2b6cff" opacity="0.18"/>
    <text x="44" y="108" fill="#e7e9ee">Dashboard</text>
    <text x="44" y="148">Routers</text>
    <text x="44" y="184">Recipes</text>
    <text x="44" y="220">Vault &amp; audit</text>
    <text x="44" y="256">Settings</text>
  </g>
  <!-- content cards -->
  <g>
    <rect x="212" y="72" width="288" height="150" rx="10" fill="#171a21"/>
    <text x="230" y="100" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#e7e9ee">Deployment</text>
    <text x="230" y="126" font-family="system-ui, sans-serif" font-size="12" fill="#9aa4b2">nginx-demo · Ready</text>
    <rect x="230" y="140" width="252" height="8" rx="4" fill="#22c55e" opacity="0.6"/>
    <text x="230" y="176" font-family="system-ui, sans-serif" font-size="11" fill="#9aa4b2">Queued → Cloning → … → Checking → Ready</text>

    <rect x="516" y="72" width="288" height="150" rx="10" fill="#171a21"/>
    <text x="534" y="100" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#e7e9ee">Software updates</text>
    <text x="534" y="126" font-family="system-ui, sans-serif" font-size="12" fill="#9aa4b2">current 0.1.0-beta.1 · up to date</text>
    <rect x="534" y="150" width="120" height="28" rx="8" fill="#2b6cff"/>
    <text x="556" y="169" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#fff">Check now</text>

    <rect x="212" y="238" width="592" height="166" rx="10" fill="#171a21"/>
    <text x="230" y="266" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#e7e9ee">Proxmox connections (real mode)</text>
    <text x="230" y="292" font-family="system-ui, sans-serif" font-size="12" fill="#9aa4b2">Metadata in SQLite · API token encrypted in the vault · pinned TLS</text>
    <text x="230" y="330" font-family="system-ui, sans-serif" font-size="12" fill="#9aa4b2">Homelab · https://pve.local:8006 · node pve</text>
    <rect x="230" y="344" width="90" height="26" rx="7" fill="#0f1115" stroke="#2a2f3a"/>
    <text x="248" y="362" font-family="system-ui, sans-serif" font-size="12" fill="#e7e9ee">Validate</text>
  </g>
  <text x="410" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5b6472">Illustrative placeholder — replace with a real panel capture before publishing.</text>
</svg>
